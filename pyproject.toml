[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "har-research"
version = "1.0.0"
description = "Subject-independent human activity recognition from smartphone inertial data"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<4", "scipy>=1.11,<2", "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4", "seaborn>=0.13,<1", "joblib>=1.3,<2", "torch>=2.2,<3", "PyYAML>=6,<7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
